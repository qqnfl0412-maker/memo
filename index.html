<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공유 메모 + 파일 첨부</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .room-text {
      margin-bottom: 6px;
      color: #666;
      font-size: 14px;
    }

    .status-text {
      margin-bottom: 14px;
      color: #4f7cff;
      font-size: 13px;
      font-weight: 700;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    #memoInput {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d8dce5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    #memoInput:focus {
      border-color: #4f7cff;
    }

    .attach-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    #fileInput {
      flex: 1;
      min-width: 0;
    }

    .selected-file {
      font-size: 13px;
      color: #666;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      height: 38px;
    }

    .add-btn {
      background: #4f7cff;
      color: white;
      min-width: 90px;
      align-self: flex-end;
    }

    .add-btn:disabled,
    .copy-btn:disabled,
    .delete-btn:disabled,
    .file-link-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .tip {
      font-size: 12px;
      color: #777;
      margin-bottom: 6px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .memo-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e6eaf2;
      border-radius: 10px;
      background: #fafbff;
      transition: opacity 0.15s ease;
    }

    .memo-item.removing {
      opacity: 0.35;
    }

    .memo-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      cursor: pointer;
      padding: 2px 0;
    }

    .memo-content:hover {
      opacity: 0.85;
    }

    .memo-time {
      font-size: 12px;
      color: #888;
    }

    .file-box {
      border: 1px solid #dfe6f2;
      background: #fff;
      border-radius: 10px;
      padding: 10px;
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .file-meta {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .file-preview {
      margin-bottom: 10px;
    }

    .file-preview img {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }

    .memo-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .copy-btn {
      background: #2ecc71;
      color: #fff;
    }

    .delete-btn {
      background: #ff5b5b;
      color: #fff;
    }

    .file-link-btn {
      background: #6366f1;
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      height: 38px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }

    @media (max-width: 640px) {
      .add-btn {
        width: 100%;
      }

      .memo-actions > * {
        flex: 1;
      }

      .file-link-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>공유 메모</h1>
      <div class="room-text" id="roomText"></div>
      <div class="status-text" id="statusText">실시간 상태: 연결 중...</div>
      <div class="tip">작은 파일 위주로 사용 추천. 이미지, PDF, 문서 파일 정도가 무난해.</div>

      <div class="input-box">
        <textarea id="memoInput" placeholder="메모를 입력하세요"></textarea>

        <div class="attach-row">
          <input type="file" id="fileInput" />
          <div class="selected-file" id="selectedFileText">선택된 파일 없음</div>
        </div>

        <button class="add-btn" id="addBtn">추가</button>
      </div>

      <div class="list" id="memoList"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://bvtywtnvkficbzuabgcc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2dHl3dG52a2ZpY2J6dWFiZ2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NTc1NDksImV4cCI6MjA4OTMzMzU0OX0.X0yxXe7Yhldp6oIVQXmZbuPBAU9FhpgEqADKAUMWaxI";
    const STORAGE_BUCKET = "memo-files";
    const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room") || "default";

    const roomText = document.getElementById("roomText");
    const statusText = document.getElementById("statusText");
    const memoInput = document.getElementById("memoInput");
    const fileInput = document.getElementById("fileInput");
    const selectedFileText = document.getElementById("selectedFileText");
    const addBtn = document.getElementById("addBtn");
    const memoList = document.getElementById("memoList");

    let isSaving = false;
    const deletingIds = new Set();

    roomText.textContent = `메모방: ${roomId}`;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      selectedFileText.textContent = file
        ? `${file.name} (${formatBytes(file.size)})`
        : "선택된 파일 없음";
    });

    function formatTime(value) {
      const d = new Date(value);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    function formatBytes(bytes = 0) {
      if (!bytes) return "0B";
      const units = ["B", "KB", "MB", "GB"];
      let i = 0;
      let value = bytes;
      while (value >= 1024 && i < units.length - 1) {
        value /= 1024;
        i++;
      }
      return `${value.toFixed(value >= 10 || i === 0 ? 0 : 1)}${units[i]}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function setStatus(text) {
      statusText.textContent = `실시간 상태: ${text}`;
    }

    function showEmptyIfNeeded() {
      if (!document.querySelector(".memo-item")) {
        memoList.innerHTML = `<div class="empty">아직 메모가 없습니다.</div>`;
      }
    }

    function isImageFile(type = "") {
      return type.startsWith("image/");
    }

    function isAllowedFile(file) {
      const allowed = [
        "image/",
        "application/pdf",
        "text/plain",
        "application/zip",
        "application/x-zip-compressed",
        "application/msword",
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        "application/vnd.ms-excel",
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        "application/vnd.ms-powerpoint",
        "application/vnd.openxmlformats-officedocument.presentationml.presentation"
      ];

      return allowed.some((item) => item.endsWith("/") ? file.type.startsWith(item) : file.type === item);
    }

    async function loadMemos() {
      const { data, error } = await supabase
        .from("memos")
        .select("*")
        .eq("room_id", roomId)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("loadMemos error:", error);
        memoList.innerHTML = `<div class="empty">메모를 불러오지 못했습니다.</div>`;
        return;
      }

      renderMemos(data || []);
    }

    function renderMemos(memos) {
      if (!memos.length) {
        memoList.innerHTML = `<div class="empty">아직 메모가 없습니다.</div>`;
        return;
      }

      memoList.innerHTML = memos.map((memo) => `
        <div class="memo-item" data-id="${memo.id}">
          ${memo.content ? `
            <div class="memo-content" data-content="${encodeURIComponent(memo.content)}">${escapeHtml(memo.content)}</div>
          ` : ""}

          ${memo.file_url ? `
            <div class="file-box">
              <div class="file-name">${escapeHtml(memo.file_name || "첨부파일")}</div>
              <div class="file-meta">${escapeHtml(memo.file_type || "파일")} · ${formatBytes(memo.file_size || 0)}</div>
              ${isImageFile(memo.file_type || "") ? `
                <div class="file-preview">
                  <img src="${memo.file_url}" alt="${escapeHtml(memo.file_name || "첨부 이미지")}" />
                </div>
              ` : ""}
              <a class="file-link-btn" href="${memo.file_url}" target="_blank" rel="noopener noreferrer">파일 열기</a>
            </div>
          ` : ""}

          <div class="memo-time">${formatTime(memo.created_at)}</div>

          <div class="memo-actions">
            ${memo.content ? `<button class="copy-btn" data-content="${encodeURIComponent(memo.content)}">복사</button>` : ""}
            <button class="delete-btn" data-id="${memo.id}" data-file-path="${memo.file_path || ""}">삭제</button>
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await deleteMemo(btn.dataset.id, btn.dataset.filePath);
        });
      });

      document.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const text = decodeURIComponent(btn.dataset.content);
          await copyText(text, btn, "복사됨!");
        });
      });

      document.querySelectorAll(".memo-content").forEach((el) => {
        el.addEventListener("click", async () => {
          const text = decodeURIComponent(el.dataset.content);
          await copyText(text, el, "내용 복사됨!");
        });
      });
    }

    async function copyText(text, targetEl, successMessage = "복사됨!") {
      try {
        await navigator.clipboard.writeText(text);

        const originalText = targetEl.dataset.originalText || targetEl.textContent;
        const isButton = targetEl.tagName === "BUTTON";

        if (!targetEl.dataset.originalText) {
          targetEl.dataset.originalText = originalText;
        }

        if (isButton) {
          targetEl.textContent = successMessage;
          targetEl.disabled = true;
          setTimeout(() => {
            targetEl.textContent = targetEl.dataset.originalText;
            targetEl.disabled = false;
          }, 1000);
        } else {
          targetEl.textContent = successMessage;
          targetEl.style.color = "#2ecc71";
          setTimeout(() => {
            targetEl.textContent = targetEl.dataset.originalText;
            targetEl.style.color = "";
          }, 1000);
        }
      } catch (err) {
        console.error("copyText error:", err);
        alert("복사에 실패했습니다.");
      }
    }

    async function uploadFile(file) {
      const safeName = file.name.replace(/[^\w.\-가-힣 ]/g, "_");
      const path = `${roomId}/${Date.now()}_${safeName}`;

      const { error: uploadError } = await supabase
        .storage
        .from(STORAGE_BUCKET)
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false
        });

      if (uploadError) {
        throw uploadError;
      }

      const { data } = supabase
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path);

      return {
        file_path: path,
        file_url: data.publicUrl,
        file_name: file.name,
        file_type: file.type || "application/octet-stream",
        file_size: file.size || 0
      };
    }

    async function addMemo() {
      const content = memoInput.value.trim();
      const file = fileInput.files?.[0] || null;

      if ((!content && !file) || isSaving) return;

      if (file) {
        if (!isAllowedFile(file)) {
          alert("지원하지 않는 파일 형식입니다.");
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          alert("파일 크기는 10MB 이하만 업로드할 수 있습니다.");
          return;
        }
      }

      isSaving = true;
      addBtn.disabled = true;
      addBtn.textContent = file ? "업로드 중..." : "저장 중...";

      try {
        let fileInfo = {
          file_name: null,
          file_path: null,
          file_url: null,
          file_type: null,
          file_size: null
        };

        if (file) {
          fileInfo = await uploadFile(file);
        }

        const { error } = await supabase
          .from("memos")
          .insert([{
            room_id: roomId,
            content: content || null,
            ...fileInfo
          }]);

        if (error) throw error;

        memoInput.value = "";
        fileInput.value = "";
        selectedFileText.textContent = "선택된 파일 없음";
        await loadMemos();
      } catch (err) {
        console.error("addMemo error:", err);
        alert("메모 저장 또는 파일 업로드에 실패했습니다.");
      } finally {
        isSaving = false;
        addBtn.disabled = false;
        addBtn.textContent = "추가";
      }
    }

    async function deleteMemo(id, filePath) {
      if (deletingIds.has(id)) return;
      deletingIds.add(id);

      const targetEl = document.querySelector(`.memo-item[data-id="${id}"]`);
      const deleteBtn = targetEl?.querySelector(".delete-btn");

      if (deleteBtn) deleteBtn.disabled = true;

      if (targetEl) {
        targetEl.classList.add("removing");
        setTimeout(() => {
          if (targetEl.isConnected) {
            targetEl.remove();
            showEmptyIfNeeded();
          }
        }, 80);
      }

      try {
        if (filePath) {
          const { error: storageError } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .remove([filePath]);

          if (storageError) {
            console.error("storage delete error:", storageError);
          }
        }

        const { error } = await supabase
          .from("memos")
          .delete()
          .eq("id", id);

        if (error) throw error;
      } catch (err) {
        console.error("deleteMemo error:", err);
        alert("삭제에 실패했습니다.");
        await loadMemos();
      } finally {
        deletingIds.delete(id);
      }
    }

    addBtn.addEventListener("click", addMemo);

    memoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        addMemo();
      }
    });

    await loadMemos();

    const channel = supabase
      .channel(`memos-room-${roomId}`)
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "memos",
          filter: `room_id=eq.${roomId}`
        },
        async (payload) => {
          console.log("realtime event:", payload);
          setStatus("이벤트 수신됨");
          await loadMemos();
        }
      )
      .subscribe((status) => {
        console.log("realtime status:", status);

        if (status === "SUBSCRIBED") setStatus("연결됨");
        else if (status === "CHANNEL_ERROR") setStatus("채널 오류");
        else if (status === "TIMED_OUT") setStatus("시간 초과");
        else if (status === "CLOSED") setStatus("연결 종료");
        else setStatus(status);
      });

    window.addEventListener("beforeunload", async () => {
      try {
        await supabase.removeChannel(channel);
      } catch (e) {
        console.error("removeChannel error:", e);
      }
    });
  </script>
</body>
</html>
