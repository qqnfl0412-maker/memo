<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공유 메모</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .room-text {
      margin-bottom: 6px;
      color: #666;
      font-size: 14px;
    }

    .status-text {
      margin-bottom: 16px;
      color: #4f7cff;
      font-size: 13px;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #memoInput {
      flex: 1;
      min-height: 56px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d8dce5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    #memoInput:focus {
      border-color: #4f7cff;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      height: 38px;
    }

    .add-btn {
      background: #4f7cff;
      color: white;
      min-width: 84px;
    }

    .add-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .memo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e6eaf2;
      border-radius: 10px;
      background: #fafbff;
      transition: opacity 0.15s ease;
    }

    .memo-item.removing {
      opacity: 0.35;
    }

    .memo-left {
      flex: 1;
      min-width: 0;
    }

    .memo-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      cursor: pointer;
      padding: 2px 0;
    }

    .memo-content:hover {
      opacity: 0.85;
    }

    .memo-time {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    .memo-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .copy-btn {
      background: #2ecc71;
      color: #fff;
      padding: 8px 10px;
    }

    .copy-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .delete-btn {
      background: #ff5b5b;
      color: #fff;
      padding: 8px 10px;
    }

    .delete-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }

    @media (max-width: 640px) {
      .input-row {
        flex-direction: column;
      }

      .add-btn {
        height: 44px;
      }

      .memo-item {
        flex-direction: column;
        align-items: stretch;
      }

      .memo-actions {
        width: 100%;
      }

      .copy-btn,
      .delete-btn {
        flex: 1;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>공유 메모</h1>
      <div class="room-text" id="roomText"></div>
      <div class="status-text" id="statusText">실시간 상태: 연결 중...</div>

      <div class="input-row">
        <textarea id="memoInput" placeholder="메모를 입력하세요"></textarea>
        <button class="add-btn" id="addBtn">추가</button>
      </div>

      <div class="list" id="memoList"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "여기에_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "여기에_SUPABASE_ANON_KEY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room") || "default";

    const roomText = document.getElementById("roomText");
    const statusText = document.getElementById("statusText");
    const memoInput = document.getElementById("memoInput");
    const addBtn = document.getElementById("addBtn");
    const memoList = document.getElementById("memoList");

    let isSaving = false;
    const deletingIds = new Set();

    roomText.textContent = `메모방: ${roomId}`;

    function formatTime(value) {
      const d = new Date(value);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function setStatus(text) {
      statusText.textContent = `실시간 상태: ${text}`;
    }

    function showEmptyIfNeeded() {
      if (!document.querySelector(".memo-item")) {
        memoList.innerHTML = `<div class="empty">아직 메모가 없습니다.</div>`;
      }
    }

    async function loadMemos() {
      const { data, error } = await supabase
        .from("memos")
        .select("*")
        .eq("room_id", roomId)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("loadMemos error:", error);
        memoList.innerHTML = `<div class="empty">메모를 불러오지 못했습니다.</div>`;
        return;
      }

      renderMemos(data || []);
    }

    function renderMemos(memos) {
      if (!memos.length) {
        memoList.innerHTML = `<div class="empty">아직 메모가 없습니다.</div>`;
        return;
      }

      memoList.innerHTML = memos.map((memo) => `
        <div class="memo-item" data-id="${memo.id}">
          <div class="memo-left">
            <div class="memo-content" data-content="${encodeURIComponent(memo.content)}">${escapeHtml(memo.content)}</div>
            <div class="memo-time">${formatTime(memo.created_at)}</div>
          </div>
          <div class="memo-actions">
            <button class="copy-btn" data-content="${encodeURIComponent(memo.content)}">복사</button>
            <button class="delete-btn" data-id="${memo.id}">삭제</button>
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          await deleteMemo(id);
        });
      });

      document.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const text = decodeURIComponent(btn.dataset.content);
          await copyText(text, btn, "복사됨!");
        });
      });

      document.querySelectorAll(".memo-content").forEach((el) => {
        el.addEventListener("click", async () => {
          const text = decodeURIComponent(el.dataset.content);
          await copyText(text, el, "내용 복사됨!");
        });
      });
    }

    async function copyText(text, targetEl, successMessage = "복사됨!") {
      try {
        await navigator.clipboard.writeText(text);

        const originalText = targetEl.dataset.originalText || targetEl.textContent;
        const isButton = targetEl.tagName === "BUTTON";

        if (!targetEl.dataset.originalText) {
          targetEl.dataset.originalText = originalText;
        }

        if (isButton) {
          targetEl.textContent = successMessage;
          targetEl.disabled = true;

          setTimeout(() => {
            targetEl.textContent = targetEl.dataset.originalText;
            targetEl.disabled = false;
          }, 1000);
        } else {
          targetEl.textContent = successMessage;
          targetEl.style.color = "#2ecc71";

          setTimeout(() => {
            targetEl.textContent = targetEl.dataset.originalText;
            targetEl.style.color = "";
          }, 1000);
        }
      } catch (err) {
        console.error("복사 실패:", err);
        alert("복사에 실패했습니다.");
      }
    }

    async function addMemo() {
      const content = memoInput.value.trim();
      if (!content || isSaving) return;

      isSaving = true;
      addBtn.disabled = true;

      const { error } = await supabase
        .from("memos")
        .insert([{ room_id: roomId, content }]);

      if (error) {
        console.error("addMemo error:", error);
        alert("메모 저장에 실패했습니다.");
      } else {
        memoInput.value = "";
        await loadMemos();
      }

      isSaving = false;
      addBtn.disabled = false;
    }

    async function deleteMemo(id) {
      if (deletingIds.has(id)) return;
      deletingIds.add(id);

      const targetEl = document.querySelector(`.memo-item[data-id="${id}"]`);
      const deleteBtn = targetEl?.querySelector(".delete-btn");

      if (deleteBtn) {
        deleteBtn.disabled = true;
      }

      if (targetEl) {
        targetEl.classList.add("removing");
        setTimeout(() => {
          if (targetEl.isConnected) {
            targetEl.remove();
            showEmptyIfNeeded();
          }
        }, 80);
      }

      const { error } = await supabase
        .from("memos")
        .delete()
        .eq("id", id);

      if (error) {
        console.error("deleteMemo error:", error);
        alert("메모 삭제에 실패했습니다.");
        await loadMemos();
      }

      deletingIds.delete(id);
    }

    addBtn.addEventListener("click", addMemo);

    memoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        addMemo();
      }
    });

    await loadMemos();

    const channel = supabase
      .channel(`memos-room-${roomId}`)
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "memos",
          filter: `room_id=eq.${roomId}`
        },
        async (payload) => {
          console.log("realtime event:", payload);
          setStatus("이벤트 수신됨");
          await loadMemos();
        }
      )
      .subscribe((status) => {
        console.log("realtime status:", status);

        if (status === "SUBSCRIBED") {
          setStatus("연결됨");
        } else if (status === "CHANNEL_ERROR") {
          setStatus("채널 오류");
        } else if (status === "TIMED_OUT") {
          setStatus("시간 초과");
        } else if (status === "CLOSED") {
          setStatus("연결 종료");
        } else {
          setStatus(status);
        }
      });

    window.addEventListener("beforeunload", async () => {
      try {
        await supabase.removeChannel(channel);
      } catch (e) {
        console.error("removeChannel error:", e);
      }
    });
  </script>
</body>
</html>
